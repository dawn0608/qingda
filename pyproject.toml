[project]
name = "wechat-manager"
version = "0.1.0"
description = "青答 Qingda：多用户隔离的微信 AI 助手与管理台"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary,pool]>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "cryptography>=44,<48",
  "python-dotenv>=1,<2",
  "pillow>=11,<13",
  "silk-python>=0.2.8,<0.3",
  "alibabacloud-dypnsapi20170525>=2,<3",
  "alibabacloud-tea-openapi>=0.4,<1",
  "alibabacloud-tea-util>=0.3,<1",
  "tokenizers>=0.22,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["wechat_manager*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
wechat_manager = ["sql/*.sql", "sql/*.json", "tokenizer/*.json", "tokenizer/*.md"]
